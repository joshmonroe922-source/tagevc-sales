name: Morning digest cron

on:
  schedule:
    # Every 15 minutes — covers each user's 6:00–6:14 local window
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  process-morning-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke process-morning-digest
        run: |
          curl -fsS -X POST \
            "https://hqmobgtnedmhzipusert.supabase.co/functions/v1/process-morning-digest" \
            -H "x-digest-secret: ${{ secrets.DIGEST_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}'
