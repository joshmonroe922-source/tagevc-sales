name: Morning digest cron

on:
  schedule:
    # Every 15 minutes — covers each user's 6:00–6:14 local window
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  process-morning-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke process-morning-digest
        env:
          # Pass via env so shell metacharacters in the secret (quotes, &, <, etc.)
          # are not interpolated into the script text (which caused exit code 2).
          DIGEST_CRON_SECRET: ${{ secrets.DIGEST_CRON_SECRET }}
          DIGEST_URL: https://hqmobgtnedmhzipusert.supabase.co/functions/v1/process-morning-digest
        run: |
          set -euo pipefail
          if [ -z "${DIGEST_CRON_SECRET:-}" ]; then
            echo "::error::DIGEST_CRON_SECRET is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "POST ${DIGEST_URL}"
          HTTP_CODE=$(curl -sS -o /tmp/digest-response.json -w "%{http_code}" -X POST \
            "${DIGEST_URL}" \
            -H "x-digest-secret: ${DIGEST_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          head -c 2000 /tmp/digest-response.json || true
          echo
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::process-morning-digest returned HTTP ${HTTP_CODE} (expected 200). If 401, GitHub DIGEST_CRON_SECRET does not match the Supabase Edge secret."
            exit 1
          fi
